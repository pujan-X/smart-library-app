<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Library AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'], syne: ['Syne', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-[#0D1117] font-manrope text-slate-200 min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-[#6C63FF]/20 rounded-full blur-[120px] -z-10"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-[#00D4AA]/10 rounded-full blur-[100px] -z-10"></div>

    <div id="toastContainer" class="fixed top-5 right-5 z-[10000] flex flex-col gap-3 pointer-events-none"></div>

    <div class="w-full max-w-md p-8 md:p-10 bg-[#0D1117]/80 backdrop-blur-2xl rounded-[2rem] border border-slate-700/50 shadow-2xl relative">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#6C63FF]/10 border border-[#6C63FF]/30 mb-4 shadow-[0_0_20px_rgba(108,99,255,0.2)]">
                <i class="fa-solid fa-book-bookmark text-3xl text-[#6C63FF]"></i>
            </div>
            <h1 class="text-3xl font-syne font-extrabold text-white tracking-tight">AI Library Hub</h1>
            <p class="text-slate-400 mt-2 text-sm">Enter your credentials to access the system</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="username" required placeholder="Enter username" class="w-full bg-[#151B23] border border-slate-700 text-white rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:border-[#6C63FF] focus:ring-1 focus:ring-[#6C63FF] transition shadow-inner">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-[#151B23] border border-slate-700 text-white rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:border-[#6C63FF] focus:ring-1 focus:ring-[#6C63FF] transition shadow-inner">
                </div>
            </div>

            <button type="button" onclick="handleLogin()" class="w-full py-3.5 mt-4 bg-gradient-to-r from-[#6C63FF] to-[#00D4AA] text-white font-bold rounded-xl shadow-[0_0_20px_rgba(108,99,255,0.3)] hover:opacity-90 hover:scale-[1.02] transition-all">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-8">
            Don't have an account? <a href="/register.html" class="text-[#00D4AA] font-bold hover:underline">Register here</a>
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
